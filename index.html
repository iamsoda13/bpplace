function showLogin(msg=''){
 $('#nav').classList.add('hidden');
 $('#app').innerHTML=`<div class="card max-w-sm mx-auto mt-16 p-6"><img src="${LOGO_FULL}" class="mx-auto h-28" alt="BP Place">

async function doLogin(){
 const u=$('#em').value.trim().toLowerCase(),email=u.includes('@')?u:u+'@bpplace.app';
 const{error}=await sb.auth.signInWithPassword({email,password:$('#pw').value});

/* ===== Data ===== */
async function loadAll(){
 const[r,t,m,i,s,e]=await Promise.all(['rooms','tenants','meters','invoices','settings','expenses'].map(n=>q(sb.from(n).select('*'))));
 D.rooms={};r.forEach(x=>D.rooms[x.room]=x.type);D.tenants=t;D.meters=m;D.invoices=i;D.expenses=e;
 const p=(s.find(x=>x.key==='pay')||{}).value||{};
 if(!p.accounts)p.accounts=p.bank?[{bank:p.bank,acc:p.acc,name:p.name,pp:p.pp}]:[];
 D.pay=p;D.set=Object.fromEntries(s.map(x=>[x.key,x.value]));
}
const reload=async()=>{await loadAll();render()};
const T=r=>D.tenants.find(t=>t.room==r&&t.active);
const sm=t=>(t.start_date||'').slice(0,7);
const occ=()=>Object.keys(D.rooms).filter(r=>{const t=T(r);return t&&sm(t)<=month});
const mt=(r,m)=>D.meters.find(x=>x.room==r&&x.month==m);
const invOf=r=>{const t=T(r);return t&&D.invoices.find(i=>i.room==r&&i.month==month&&i.data.tid==t.id)};
function prev(r,m,k){
 const t=T(r),s=t?sm(t):'';
 const ks=D.meters.filter(x=>x.room==r&&x.month<m&&x.month>=s).sort((a,b)=>b.month.localeCompare(a.month));
 return ks.length?+ks[0][k]:+(t?.[k+'0']||0);
}
const last=(r,k)=>prev(r,'9999-99',k);
const calc=d=>{
 const eu=Math.max(0,d.eNew-d.eOld),wu=Math.max(0,d.wNew-d.wOld),elec=eu*EP,water=Math.max(WMIN,wu*WP);
 const extra=(d.extras||[]).reduce((s,x)=>s+(+x.amt||0),0);
 return{eu,wu,elec,water,extra,total:d.rent+elec+water+extra};
};
const tot=a=>a.reduce((s,i)=>s+calc(i.data).total,0);
const owed=(tid,before)=>tot(D.invoices.filter(i=>i.data.tid==tid&&!i.paid&&i.month<before));
const overdue=r=>{const t=T(r);return t&&owed(t.id,nowM())>0};
const LATE=()=>D.pay.late==null||D.pay.late===''?50:+D.pay.late;
const lateInfo=i=>{
 const due=pm(i.month,1)+'-'+String(+D.pay.due||5).padStart(2,'0'),days=Math.max(0,Math.floor((new Date(today())-new Date(due))/864e5));
 const frozen=i.paid||i.data.extras.some(x=>/^ค่าปรับ/.test(x.label));
 return{due,days,fee:frozen?0:days*LATE()};
};

function outCalc(){
 if(!$('#od'))return;
 const r=outR,t=T(r),rent=RENT[D.rooms[r]],days=+$('#ox').value||0,om=$('#od').value.slice(0,7);
 const e=+$('#oe').value||0,w=+$('#ow').value||0,eu=Math.max(0,e-last(r,'e')),wu=Math.max(0,w-last(r,'w'));
 const ex=getEx(),exT=ex.reduce((s,x)=>s+x.amt,0);
 const un=D.invoices.filter(i=>i.data.tid==t.id&&!i.paid&&i.month<om),unT=tot(un);
 const fr=Math.round(rent*days/30),el=eu*EP,wa=Math.max(WMIN,wu*WP);
 const ch=unT+fr+el+wa+exT,dep=+t.deposit||0,adv=+t.advance||0,kc=$('#okc').checked?(+t.keycard||0):0,net=ch-dep-adv-kc;
 OS={un:un.map(i=>i.id),unT,fr,el,wa,ex,eu,wu,ch,dep,adv,kc,net,days,e,w,date:$('#od').value};
 $('#inv').innerHTML=stmt(OS,t);
}

async function syncInv(r,m,e,w,skipSame){
 const t=T(r);if(!t)return;
 for(const i of D.invoices.filter(i=>i.room==r&&i.data.tid==t.id&&!i.paid)){
  const d=i.month==m&&!skipSame?{...i.data,eNew:e,wNew:w}:i.month==pm(m,1)?{...i.data,eOld:e,wOld:w}:null;
  if(d)await q(sb.from('invoices').update({data:d}).eq('id',i.id));
 }
}
async function saveMeters(){
 const rows=[],err=[];
 occ().forEach(r=>{const e=$('#e'+r).value,w=$('#w'+r).value;if(e===''&&w==='')return;
  if(e===''||w==='')return err.push(r+': กรอกไม่ครบ');
  if(+e<prev(r,month,'e')||+w<prev(r,month,'w'))return err.push(r+': เลขใหม่น้อยกว่าเดิม');
  rows.push({room:+r,month,e:+e,w:+w});});
 if(rows.length)await q(sb.from('meters').upsert(rows,{onConflict:'room,month'}));
 for(const x of rows)await syncInv(x.room,month,x.e,x.w);
 alert(`บันทึก ${rows.length} ห้อง`+(err.length?'\nมีปัญหา:\n'+err.join('\n'):''));reload();
}

function newInv(r){
 const t=T(r),m=mt(r,month);if(!t||!m||invOf(r))return null;
 let rent=RENT[D.rooms[r]],note='';
 if(t.start_date&&sm(t)==month){
  const dim=new Date(+month.slice(0,4),+month.slice(5),0).getDate(),dd=Math.min(30,dim-(+t.start_date.slice(8))+1);
  if(dd<30){rent=Math.round(rent*dd/30);note=dd+'/30 วัน'}
 }
 return{id:`${r}_${month}_${t.id.slice(0,6)}`,room:+r,month,data:{tid:t.id,name:t.name,type:D.rooms[r],rent,rentNote:note,
  eOld:prev(r,month,'e'),eNew:+m.e,wOld:prev(r,month,'w'),wNew:+m.w,extras:[],note:'',acct:0}};
}

function ppPayload(id,amt){
 id=String(id).replace(/\D/g,'');
 const f=(t,v)=>t+String(v.length).padStart(2,'0')+v,ph=id.length<=10;
 const acc=f('00','A000000677010111')+(ph?f('01','0066'+id.replace(/^0/,'')):f('02',id));
 const s=f('00','01')+f('01',amt?'12':'11')+f('29',acc)+f('53','764')+(amt?f('54',(+amt).toFixed(2)):'')+f('58','TH')+'6304';
 let c=0xFFFF;
 for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}
 return s+c.toString(16).toUpperCase().padStart(4,'0');
}
function lineMsg(id){
 const i=D.invoices.find(x=>x.id==id),d=i.data,c=calc(d),A=D.pay.accounts,ac=A[d.acct||0]||A[0],ow=owed(d.tid,i.month),li=lateInfo(i);
 const L=[`BP Place แจ้งค่าเช่า ห้อง ${i.room}`,`ประจำเดือน ${thM(i.month)}`,`ค่าเช่า ${fmt(d.rent)} บาท`,`ค่าไฟ ${c.eu} หน่วย ${fmt(c.elec)} บาท`,`ค่าน้ำ ${c.wu} หน่วย ${fmt(c.water)} บาท`,...d.extras.map(x=>`${x.label} ${fmt(x.amt)} บาท`),`รวม ${fmt(c.total)} บาท`];
 if(!i.paid){
  if(ow>0)L.push(`ยอดค้างก่อนหน้า ${fmt(ow)} บาท`);
  if(li.fee>0)L.push(`ค่าปรับล่าช้า ${li.days} วัน ${fmt(li.fee)} บาท`);
  if(ow>0||li.fee>0)L.push(`รวมที่ต้องชำระ ${fmt(ow+c.total+li.fee)} บาท`);
  L.push(`กรุณาชำระภายในวันที่ ${+D.pay.due||5} ${thM(pm(i.month,1))}`);
  if(ac)L.push(`โอนเข้า ${[ac.bank,ac.acc,ac.name].filter(Boolean).join(' ')}${ac.pp?' / พร้อมเพย์ '+ac.pp:''}`);
 }else L.push('ชำระเรียบร้อยแล้ว ขอบคุณค่ะ');
 return L.join('\n');
}

/* ===== Settings ===== */
const acctRow=(a={})=>`<div class="acct grid grid-cols-2 gap-2 p-2 rounded-lg bg-amber-50"><input class="inp ab" placeholder="ธนาคาร" value="${esc(a.bank)}"><input class="inp ac" placeholder="เลขที่บัญชี" value="${esc(a.acc)}">
 <input class="inp an" placeholder="ชื่อบัญชี" value="${esc(a.name)}"><input class="inp ap" placeholder="พร้อมเพย์ (ถ้ามี)" value="${esc(a.pp)}"><button class="btn2 col-span-2" onclick="this.parentElement.remove()">ลบบัญชีนี้</button></div>`;
function vSet(){
 const p=D.pay,L=D.set.lessor||{};
 return`<div class="card p-4 max-w-lg"><div class="font-medium mb-2 text-[#B8431F]">บัญชีรับโอนเงิน (เลือกบัญชีได้ตอนดูใบวางบิล)</div>
 <div id="accts" class="grid gap-2">${(p.accounts.length?p.accounts:[{}]).map(acctRow).join('')}</div>
 <button class="btn2 mt-2" onclick="$('#accts').insertAdjacentHTML('beforeend',acctRow())">+ เพิ่มบัญชี</button>
 <div class="grid gap-2 mt-3 text-sm"><label>ชำระภายในวันที่ (ของเดือนถัดไป)<input id="sd" class="inp" value="${esc(p.due)}" placeholder="5"></label>
 <label>ค่าปรับล่าช้า (บาท/วัน)<input id="sl" type="number" class="inp" value="${esc(p.late??50)}"></label>
 <label>ข้อความเพิ่มเติมในใบวางบิล<input id="so" class="inp" value="${esc(p.note)}" placeholder="เช่น โอนแล้วส่งสลิปทาง LINE"></label></div>
 <button class="btn mt-3" onclick="saveSet()">บันทึก</button></div>
 <div class="card p-4 max-w-lg mt-4"><div class="font-medium mb-1 text-[#B8431F]">สำรองข้อมูล</div><div class="text-xs text-gray-500 mb-2">ดาวน์โหลดผู้เช่า ใบแจ้งหนี้ มิเตอร์ และค่าใช้จ่ายไว้เก็บ (ไม่รวมไฟล์บัตรประชาชน)</div>
 <div class="flex gap-2 flex-wrap"><button class="btn" onclick="exportXlsx()">ดาวน์โหลด Excel</button><button class="btn2" onclick="exportJson()">ดาวน์โหลด JSON</button></div></div>
 <div class="card p-4 max-w-lg mt-4"><div class="font-medium mb-2 text-[#B8431F]">ข้อมูลผู้ให้เช่า (ใช้ในสัญญาเช่า)</div><div class="grid gap-2 text-sm">
 <label>ชื่อ-สกุลผู้ให้เช่า<input id="ln" class="inp" value="${esc(L.name)}"></label><label>เลขบัตรประชาชน<input id="li" class="inp" value="${esc(L.id)}"></label>
 <label>ที่อยู่ตามบัตรประชาชน<textarea id="la" rows="2" class="inp">${esc(L.addr)}</textarea></label></div><button class="btn mt-3" onclick="saveLessor()">บันทึก</button></div>
 <div class="card p-4 max-w-lg mt-4" style="border-color:#fca5a5"><div class="font-medium text-red-600 mb-1">รีเซ็ตฐานข้อมูลลูกค้า</div>
 <div class="text-xs text-gray-500 mb-2">ลบผู้เช่า ลูกค้าเก่า มิเตอร์ ใบแจ้งหนี้ และไฟล์บัตรทั้งหมด เพื่อเริ่มต้นใหม่ (ห้อง ประเภทห้อง และตั้งค่าบัญชีจะคงไว้) กู้คืนไม่ได้</div>
 <label class="text-sm block mb-2"><input id="rx" type="checkbox"> ลบรายการค่าใช้จ่ายด้วย</label>
 <button class="btn" style="background:#dc2626" onclick="resetAll()">รีเซ็ตเป็นเริ่มต้น</button></div>`;
}
async function saveSet(){
 const accounts=[...document.querySelectorAll('.acct')].map(d=>({bank:d.querySelector('.ab').value,acc:d.querySelector('.ac').value,name:d.querySelector('.an').value,pp:d.querySelector('.ap').value})).filter(a=>a.bank||a.pp);
 await q(sb.from('settings').upsert({key:'pay',value:{accounts,due:$('#sd').value,late:$('#sl').value===''?50:+$('#sl').value,note:$('#so').value}}));alert('บันทึกแล้ว');reload();
}

function openM(h){$('#mbody').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeM(){$('#modal').classList.add('hidden')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#month').onchange=e=>{if(e.target.value){month=e.target.value;render()}};
boot();
</script>
